name: Deploy public site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public snapshot
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          set -eu
          mkdir _site
          cp index.html archive.html public.js style.css catalog.json .nojekyll _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -d assets ]; then cp -R assets _site/; fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The artifact service can briefly return an empty listing after a
      # successful upload. See actions/deploy-pages#451.
      - name: Allow artifact indexing to finish
        run: sleep 60
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
